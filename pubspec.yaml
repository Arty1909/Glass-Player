name: player
description: "Glass music player with local library playback."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path: ^1.9.0
  audioplayers: ^6.5.1
  flutter_media_metadata: ^1.0.0+1
  flip_card: ^0.7.0
  dart_tags: ^0.4.1
  audio_service: ^0.18.18
  universal_io: ^2.2.2

dependency_overrides:
  flutter_media_metadata:
    path: plugins/flutter_media_metadata


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo1.png"
  min_sdk_android: 26
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo/logo1.png"
    background_color: "#EEF3FF"
    theme_color: "#7A4DFF"
  windows:
    generate: true
    image_path: "assets/logo/logo1.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo/logo1.png"



flutter:
  uses-material-design: true

  assets:
      - assets/images/
      - assets/logo/


